[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "house-protocol"
version = "0.1.0"
description = "Program to monitor world/national/stock events"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10,<4",
    "requests>=2.31",
    "pandas>=2.2",
    "pyarrow>=15.0.0",
    "holidays>=0.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]