name: house-protocol

services:
  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
    mem_limit: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: python -m house_protocol.scheduler

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: house
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: house
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    mem_limit: 256m
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U house"]
      interval: 10s
      retries: 5


  grafana:
    image: grafana/grafana-oss:11.3.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana:/var/lib/grafana
    ports:
      - "3000:3000"
    mem_limit: 384m